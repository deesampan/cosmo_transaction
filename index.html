<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Income</title>
<style>
  :root {
    --bg: #f6f5f2;
    --card: #ffffff;
    --text: #1d1d1f;
    --muted: #8a8a8e;
    --line: #e7e5e0;
    --danger: #c2410c;

    --cash: #2f7d5b;     --cash-bg: #e3f1ea;
    --transfer: #2563eb; --transfer-bg: #e3ecfd;
    --half: #b45309;     --half-bg: #fbeedd;
    --on-type: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141414;
      --card: #1e1e1e;
      --text: #f2f2f2;
      --muted: #9a9a9a;
      --line: #2c2c2c;
      --danger: #f97352;

      --cash: #4fbf8b;     --cash-bg: #173326;
      --transfer: #7aa7ff; --transfer-bg: #1b2a47;
      --half: #f0a95b;     --half-bg: #3a2a17;
      --on-type: #111111;
    }
  }
  /* Each income type sets --t / --t-bg for whatever it's applied to */
  [data-type="cash"]     { --t: var(--cash);     --t-bg: var(--cash-bg); }
  [data-type="transfer"] { --t: var(--transfer); --t-bg: var(--transfer-bg); }
  [data-type="half"]     { --t: var(--half);     --t-bg: var(--half-bg); }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", "Leelawadee UI", "Noto Sans Thai", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  input, button, select { font: inherit; color: inherit; }
  button, select { cursor: pointer; }

  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px 80px; }

  /* Header: total, type picker and add form stay visible while scrolling */
  header { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 20px 0 14px; }
  .top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  h1 { margin: 0; font-size: 15px; font-weight: 600; color: var(--muted); }
  .count { font-size: 14px; color: var(--muted); }
  .total {
    margin: 2px 0 14px;
    font-size: 44px; font-weight: 700; letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
  }

  /* Type picker — each option also shows its subtotal */
  .types { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 8px; }
  .types button {
    display: flex; flex-direction: column; align-items: flex-start; gap: 1px;
    min-width: 0;
    padding: 9px 12px;
    background: var(--card);
    border: 1px solid var(--line); border-radius: 10px;
    text-align: left;
  }
  .types b { font-size: 15px; font-weight: 600; }
  .types span { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .types button[aria-checked="true"] {
    background: var(--t-bg);
    border-color: var(--t);
    box-shadow: inset 0 0 0 1px var(--t);
  }
  .types button[aria-checked="true"] b { color: var(--t); }
  .types button:focus-visible { outline: 2px solid var(--t); outline-offset: 2px; }

  form { display: grid; grid-template-columns: 110px 1fr auto; gap: 8px; }
  form input {
    min-width: 0;
    padding: 12px;
    background: var(--card);
    border: 1px solid var(--line); border-radius: 10px;
  }
  form input:focus { outline: none; border-color: var(--t); box-shadow: 0 0 0 3px var(--t-bg); }
  form input.bad { border-color: var(--danger); }
  .add {
    padding: 0 20px;
    background: var(--t); color: var(--on-type);
    border: 0; border-radius: 10px;
    font-weight: 600;
  }
  @media (max-width: 440px) {
    form { grid-template-columns: 100px 1fr; }
    .add { grid-column: 1 / -1; padding: 12px; }
    .types button { padding: 8px 10px; }
    .types b { font-size: 14px; }
  }

  /* List */
  ul {
    list-style: none; margin: 0; padding: 0;
    background: var(--card);
    border: 1px solid var(--line); border-radius: 14px;
    overflow: hidden;
  }
  li {
    display: grid;
    grid-template-columns: 22px 80px 1fr auto 32px 32px;
    grid-template-areas: "n tag det amt edit del";
    align-items: center; column-gap: 6px;
    padding: 4px 6px 4px 10px;
    border-top: 1px solid var(--line);
    cursor: pointer;
  }
  li:first-child { border-top: 0; }
  li:hover { background: var(--bg); }
  .n { grid-area: n; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .tag {
    grid-area: tag; justify-self: start;
    padding: 3px 10px;
    background: var(--t-bg); color: var(--t);
    border-radius: 999px;
    font-size: 12px; font-weight: 600; white-space: nowrap;
  }
  .det {
    grid-area: det; min-width: 0; padding: 6px 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .det.none { color: var(--muted); }
  .amt { grid-area: amt; text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
  .icon {
    display: grid; place-items: center;
    width: 32px; height: 32px;
    background: transparent; border: 0; border-radius: 8px;
    color: var(--muted); font-size: 20px; line-height: 1;
  }
  .icon:hover, .icon:focus-visible { color: var(--text); background: var(--card); outline: none; }
  .edit-btn { grid-area: edit; }
  .del { grid-area: del; }
  .del:hover, .del:focus-visible { color: var(--danger); }
  @media (max-width: 440px) {
    li {
      grid-template-columns: 22px 1fr auto 32px 32px;
      grid-template-areas: "n det amt edit del" "n tag amt edit del";
      row-gap: 2px; padding-block: 8px;
    }
    .det { padding: 0; }
  }

  /* A row being edited */
  li.editing { display: block; padding: 12px; background: var(--t-bg); cursor: default; }
  .edit-types { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 8px; }
  .edit-types button {
    padding: 7px 6px;
    background: var(--card);
    border: 1px solid var(--line); border-radius: 8px;
    font-size: 14px;
  }
  .edit-types button[aria-checked="true"] {
    color: var(--t); font-weight: 600;
    border-color: var(--t); box-shadow: inset 0 0 0 1px var(--t);
  }
  .edit-fields { display: grid; grid-template-columns: 110px 1fr; gap: 8px; }
  .edit-fields input {
    min-width: 0;
    padding: 10px 12px;
    background: var(--card);
    border: 1px solid var(--line); border-radius: 8px;
  }
  .edit-fields input:focus { outline: none; border-color: var(--t); }
  .edit-fields input.bad { border-color: var(--danger); }
  .edit-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }
  .edit-actions button {
    padding: 8px 18px;
    background: var(--card);
    border: 1px solid var(--line); border-radius: 8px;
    font-size: 14px; font-weight: 600;
  }
  .edit-actions .save { background: var(--t); color: var(--on-type); border-color: transparent; }
  @media (max-width: 440px) {
    .edit-fields { grid-template-columns: 100px 1fr; }
  }
  .empty { padding: 28px 16px; text-align: center; color: var(--muted); }

  .foot { display: flex; justify-content: flex-end; margin-top: 12px; }
  .clear { padding: 6px 0; background: none; border: 0; color: var(--muted); font-size: 14px; }
  .clear:hover { color: var(--danger); }

  .toast {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
    display: flex; align-items: center; gap: 16px;
    max-width: calc(100% - 32px);
    padding: 10px 16px;
    background: var(--text); color: var(--bg);
    border-radius: 10px; font-size: 14px;
  }
  .toast[hidden] { display: none; }
  .toast span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .toast button { padding: 0; background: none; border: 0; font-weight: 700; text-decoration: underline; }
</style>
</head>
<body>
<div class="wrap">
  <header id="header" data-type="cash">
    <div class="top">
      <h1>รายรับ · Income</h1>
      <span class="count" id="count"></span>
    </div>
    <div class="total" id="total">฿0</div>

    <div class="types" id="types" role="radiogroup" aria-label="Income type"></div>

    <form id="form" autocomplete="off">
      <input id="amount" inputmode="decimal" placeholder="Amount" aria-label="Amount">
      <input id="detail" placeholder="Detail" aria-label="Detail">
      <button class="add" type="submit">Add</button>
    </form>
  </header>

  <ul id="list"></ul>
  <div class="empty" id="empty" hidden>No transactions yet.</div>

  <div class="foot">
    <button class="clear" id="clear" type="button">Clear all</button>
  </div>
</div>

<div class="toast" id="toast" hidden>
  <span id="toastMsg"></span>
  <button id="undo" type="button">Undo</button>
</div>

<script>
  const KEY = 'cosmo-transactions-v1';
  const TYPE_KEY = 'cosmo-last-type';

  const TYPES = {
    cash: 'เงินสด',
    transfer: 'เงินโอน',
    half: 'คนละครึ่ง',
  };

  // Transactions copied from the handwritten cash sheet (all เงินสด)
  const SEED = [
    [200, 'เค้ก + เทียน 2'],
    [150, 'เค้ก'],
    [45, 'เครปเค้ก'],
    [30, 'ของเล่น ×3'],
    [25, 'บราวนี่ 1 free 1'],
    [100, 'เค้กฝอยทอง ×2'],
    [10, 'ของเล่น'],
    [40, 'ของเล่น'],
    [20, 'ของเล่น'],
    [100, 'เค้กกล่อง'],
    [20, 'ของเล่น'],
    [100, 'เค้ก 3 เหลี่ยม ×3'],
    [20, 'ของเล่น'],
    [24, 'ขนมปังแยม'],
    [20, 'ของเล่น'],
    [50, 'ชิฟฟ่อน ×4'],
    [10, 'ของเล่น'],
    [10, 'ของเล่น'],
    [40, 'เยลลี่'],
    [20, 'ของเล่น'],
    [150, 'เค้ก'],
    [37, 'เค้กของแถม (free 1)'],
    [7, 'ชิฟฟ่อน'],
    [150, 'เค้ก 1 ก้อน'],
    [30, 'ของเล่น + เยลลี่'],
    [40, 'ซอฟเค้ก'],
    [98, 'เค้กของแถม (เซ็ต)'],
    [50, 'othering'],
    [10, 'othering'],
    [20, 'othering'],
    [30, 'othering'],
  ];

  const $ = (id) => document.getElementById(id);
  const list = $('list'), totalEl = $('total'), countEl = $('count'), empty = $('empty');
  const header = $('header'), typesEl = $('types');
  const form = $('form'), amountIn = $('amount'), detailIn = $('detail');
  const toast = $('toast'), toastMsg = $('toastMsg');

  let items = load();
  let currentType = loadType();
  let undoSnapshot = null, toastTimer = null;

  function load() {
    let data = null;
    try {
      const saved = localStorage.getItem(KEY);
      if (saved) data = JSON.parse(saved);
    } catch (e) {}
    if (!Array.isArray(data)) data = SEED.map(([amount, detail]) => ({ amount, detail }));
    // Entries saved before types existed were all cash
    return data.map((it) => ({ ...it, type: TYPES[it.type] ? it.type : 'cash' }));
  }

  function loadType() {
    try {
      const t = localStorage.getItem(TYPE_KEY);
      if (TYPES[t]) return t;
    } catch (e) {}
    return 'cash';
  }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(items)); } catch (e) {}
  }

  const fmtNum = (n) => n.toLocaleString('en-US', { maximumFractionDigits: 2 });
  const fmt = (n) => '฿' + fmtNum(n);

  function parseAmount(v) {
    const n = parseFloat(String(v).replace(/[,฿\s]/g, ''));
    return Number.isFinite(n) ? n : NaN;
  }

  // Type picker buttons
  const typeButtons = {};
  for (const [key, label] of Object.entries(TYPES)) {
    const b = document.createElement('button');
    b.type = 'button';
    b.setAttribute('role', 'radio');
    b.dataset.type = key;
    b.innerHTML = '<b></b><span>฿0</span>';
    b.querySelector('b').textContent = label;
    b.addEventListener('click', () => { setType(key); amountIn.focus(); });
    typesEl.append(b);
    typeButtons[key] = b;
  }

  function setType(key) {
    currentType = key;
    header.dataset.type = key;
    for (const [k, b] of Object.entries(typeButtons)) b.setAttribute('aria-checked', k === key);
    try { localStorage.setItem(TYPE_KEY, key); } catch (e) {}
  }

  function renderTotal() {
    const sums = { cash: 0, transfer: 0, half: 0 };
    let sum = 0;
    for (const it of items) {
      const a = Number(it.amount) || 0;
      sums[it.type] += a;
      sum += a;
    }
    totalEl.textContent = fmt(sum);
    countEl.textContent = items.length + (items.length === 1 ? ' item' : ' items');
    for (const k in TYPES) typeButtons[k].querySelector('span').textContent = fmt(sums[k]);
  }

  const PENCIL =
    '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
    'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';

  let editing = null; // index of the row currently being edited

  function render() {
    list.innerHTML = '';
    items.forEach((it, i) => list.append(i === editing ? editRow(it) : viewRow(it, i)));
    list.hidden = items.length === 0;
    empty.hidden = items.length > 0;
    renderTotal();
  }

  function viewRow(it, i) {
    const li = document.createElement('li');
    li.dataset.type = it.type;
    li.innerHTML =
      '<span class="n"></span><span class="tag"></span><span class="det"></span><span class="amt"></span>' +
      '<button class="icon edit-btn" type="button" aria-label="Edit">' + PENCIL + '</button>' +
      '<button class="icon del" type="button" aria-label="Delete">×</button>';
    const [n, tag, det, amt, , del] = li.children;
    n.textContent = i + 1;
    tag.textContent = TYPES[it.type];
    det.textContent = it.detail || '—';
    det.classList.toggle('none', !it.detail);
    amt.textContent = fmtNum(Number(it.amount) || 0);

    // Tapping anywhere on the row (except delete) opens it for editing
    li.addEventListener('click', (e) => {
      if (!e.target.closest('.del')) startEdit(i);
    });
    del.addEventListener('click', () => {
      const what = fmt(it.amount) + (it.detail ? ' · ' + it.detail : '');
      if (!confirm('Delete this transaction?\n\n' + TYPES[it.type] + '  ' + what)) return;
      snapshot();
      items.splice(i, 1);
      editing = null;
      commit('Deleted ' + what);
    });
    return li;
  }

  function editRow(it) {
    const li = document.createElement('li');
    li.className = 'editing';
    let draftType = it.type;
    li.dataset.type = draftType;
    li.innerHTML =
      '<div class="edit-types" role="radiogroup" aria-label="Type"></div>' +
      '<div class="edit-fields">' +
        '<input class="e-amt" inputmode="decimal" placeholder="Amount" aria-label="Amount">' +
        '<input class="e-det" placeholder="Detail" aria-label="Detail">' +
      '</div>' +
      '<div class="edit-actions">' +
        '<button class="cancel" type="button">Cancel</button>' +
        '<button class="save" type="button">Save</button>' +
      '</div>';
    const typesBox = li.querySelector('.edit-types');
    const amtIn = li.querySelector('.e-amt');
    const detIn = li.querySelector('.e-det');
    amtIn.value = it.amount;
    detIn.value = it.detail;

    for (const [key, label] of Object.entries(TYPES)) {
      const b = document.createElement('button');
      b.type = 'button';
      b.setAttribute('role', 'radio');
      b.dataset.type = key;
      b.textContent = label;
      b.setAttribute('aria-checked', key === draftType);
      b.addEventListener('click', () => {
        draftType = key;
        li.dataset.type = key;
        for (const x of typesBox.children) x.setAttribute('aria-checked', x.dataset.type === key);
      });
      typesBox.append(b);
    }

    const saveEdit = () => {
      const amount = parseAmount(amtIn.value);
      if (Number.isNaN(amount) || amount === 0) {
        amtIn.classList.add('bad');
        amtIn.focus();
        return;
      }
      Object.assign(it, { type: draftType, amount, detail: detIn.value.trim() });
      editing = null;
      save();
      render();
    };
    const cancelEdit = () => { editing = null; render(); };

    li.querySelector('.save').addEventListener('click', saveEdit);
    li.querySelector('.cancel').addEventListener('click', cancelEdit);
    li.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); saveEdit(); }
      if (e.key === 'Escape') cancelEdit();
    });
    amtIn.addEventListener('input', () => amtIn.classList.remove('bad'));
    return li;
  }

  function startEdit(i) {
    editing = i;
    render();
    const li = list.children[i];
    const input = li.querySelector('.e-amt');
    input.focus({ preventScroll: true });
    input.select();
    li.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  function snapshot() { undoSnapshot = items.map((it) => ({ ...it })); }

  function commit(message) {
    save();
    render();
    toastMsg.textContent = message;
    toast.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toast.hidden = true; undoSnapshot = null; }, 6000);
  }

  $('undo').addEventListener('click', () => {
    if (!undoSnapshot) return;
    items = undoSnapshot;
    undoSnapshot = null;
    editing = null;
    toast.hidden = true;
    save();
    render();
  });

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const amount = parseAmount(amountIn.value);
    if (Number.isNaN(amount) || amount === 0) {
      amountIn.classList.add('bad');
      amountIn.focus();
      return;
    }
    items.push({ type: currentType, amount, detail: detailIn.value.trim() });
    save();
    render();
    form.reset();
    amountIn.focus();
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
  });

  amountIn.addEventListener('input', () => amountIn.classList.remove('bad'));

  $('clear').addEventListener('click', () => {
    if (!items.length || !confirm('Delete all ' + items.length + ' transactions?')) return;
    snapshot();
    items = [];
    editing = null;
    commit('All transactions cleared');
  });

  setType(currentType);
  render();
</script>
</body>
</html>
